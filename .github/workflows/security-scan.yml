name: Daily security scan

# Sweeps every repo listed in security-scanner/config/repos.json, then opens,
# updates and closes GitHub issues to match what the scanners currently find.
on:
  schedule:
    # 05:30 UTC daily - off the hour, since :00 is heavily contended on GitHub's
    # scheduler and delays scheduled runs.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Scan only this repo (owner/name). Leave blank for all."
        required: false
      dry-run:
        description: "Plan issue changes without writing them"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Pinned by version AND content hash, so a scan is reproducible and a
  # compromised or re-tagged upstream release cannot silently land in the
  # pipeline. Bump both together, deliberately.
  #
  # The osv-scanner, trivy, gitleaks and syft hashes are taken from each
  # project's own published checksum file. zizmor publishes no checksum file,
  # so its hash was computed from the downloaded artifact: that still makes any
  # future change to the artifact fail loudly, but it is not an independent
  # authenticity check the way the other four are.
  OSV_SCANNER_VERSION: "2.2.4"
  OSV_SCANNER_SHA256: "7702cd1e5d9f5059dd9570f4ad967f27d3c5f5391b371ec937b384c238177f55"
  TRIVY_VERSION: "0.70.0"
  TRIVY_SHA256: "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9"
  GITLEAKS_VERSION: "8.30.0"
  GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
  SYFT_VERSION: "1.41.1"
  SYFT_SHA256: "d5ef5af2acebe7f6e60dda19a708fdf4d6f3f49f8d6b2d3e29265c1629f5d121"
  ZIZMOR_VERSION: "1.19.0"
  ZIZMOR_SHA256: "64dd578889f4c2e277b084060ef47fd98f933723399af9145ae2768aae76a71c"

jobs:
  matrix:
    name: Build repo matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Leave no credential in .git/config for later steps or artifacts to
          # pick up; this job only reads the config file.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - id: build
        env:
          # Passed through the environment rather than interpolated into the
          # script: a workflow_dispatch input expanded directly into a shell
          # command is a code injection vector.
          REPO_FILTER: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          MATRIX=$(node security-scanner/src/index.mjs list --config security-scanner/config/repos.json)

          # A manual run can narrow the sweep to a single repo.
          if [ -n "$REPO_FILTER" ]; then
            MATRIX=$(printf '%s' "$MATRIX" | node -e '
              const wanted = process.env.REPO_FILTER;
              const data = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const include = data.include.filter((entry) => entry.repo === wanted);
              if (include.length === 0) {
                console.error("Repo " + wanted + " is not in the config");
                process.exit(1);
              }
              console.log(JSON.stringify({ include }));
            ')
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Scanning: $MATRIX"

  scan:
    name: Scan ${{ matrix.repo }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      # One repo's failure must not cancel the rest of the sweep.
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Check out the scanner
        uses: actions/checkout@v4
        with:
          path: scanner
          # SCAN_TOKEN carries issues:write across every target repo, so it must
          # not be left behind in .git/config where a later step or an uploaded
          # artifact could carry it out of the job.
          persist-credentials: false

      # The repo list spans more than one owner, and the most common setup
      # mistake - a token that exists but is not authorized for the second
      # org - surfaces from checkout as a bare "repository not found". Say
      # what is actually wrong instead.
      - name: Verify token access to ${{ matrix.repo }}
        env:
          SCAN_TOKEN: ${{ secrets.SCAN_TOKEN }}
          TARGET_REPO: ${{ matrix.repo }}
        run: |
          set -euo pipefail

          if [ -z "${SCAN_TOKEN:-}" ]; then
            echo "::error::SCAN_TOKEN is not set. Add a PAT or GitHub App token with contents:read and issues:write on ${TARGET_REPO}."
            exit 1
          fi

          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${SCAN_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPO}")

          case "$code" in
            200)
              echo "Access to ${TARGET_REPO} confirmed."
              ;;
            401)
              echo "::error::SCAN_TOKEN was rejected (401). It is invalid, revoked or expired."
              exit 1
              ;;
            403)
              echo "::error::SCAN_TOKEN is forbidden (403) for ${TARGET_REPO}. If that org enforces SAML SSO, the token must be authorized for it."
              exit 1
              ;;
            404)
              echo "::error::SCAN_TOKEN cannot see ${TARGET_REPO} (404). For a private repo this usually means the token has no access to that owner, rather than that the repo is missing. Check the token covers this org, and for a GitHub App that the app is installed on it."
              exit 1
              ;;
            *)
              echo "::error::Unexpected HTTP ${code} checking access to ${TARGET_REPO}."
              exit 1
              ;;
          esac

      - name: Check out ${{ matrix.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.branch }}
          path: target
          token: ${{ secrets.SCAN_TOKEN }}
          # Full history is not needed and is slow on large repos.
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install scan engines
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.scanbin"
          cd "$HOME/.scanbin"

          # Download to a file and verify its hash BEFORE unpacking or running
          # it. Piping curl straight into tar, as this step used to, executes
          # whatever the network returned - which is precisely the supply chain
          # risk this scanner exists to catch.
          fetch() {
            local url="$1" file="$2" sha="$3"
            curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$file"
            echo "${sha}  ${file}" | sha256sum -c -
          }

          fetch "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            osv-scanner "$OSV_SCANNER_SHA256"
          chmod +x osv-scanner

          fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            trivy.tar.gz "$TRIVY_SHA256"
          tar xzf trivy.tar.gz trivy

          fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            gitleaks.tar.gz "$GITLEAKS_SHA256"
          tar xzf gitleaks.tar.gz gitleaks

          fetch "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            syft.tar.gz "$SYFT_SHA256"
          tar xzf syft.tar.gz syft

          # The release binary rather than pipx: pip installs are not content
          # verified, so a pinned version alone would not detect a re-published
          # artifact.
          fetch "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            zizmor.tar.gz "$ZIZMOR_SHA256"
          # This archive stores its member as "./zizmor", unlike the others.
          tar xzf zizmor.tar.gz ./zizmor

          rm -f ./*.tar.gz
          chmod +x osv-scanner trivy gitleaks syft zizmor
          echo "$HOME/.scanbin" >> "$GITHUB_PATH"

      - name: Verify engines are runnable
        run: |
          set -euo pipefail
          osv-scanner --version
          trivy --version
          gitleaks version
          syft version
          zizmor --version

      - name: Name outputs after the repo
        id: slug
        env:
          TARGET_REPO: ${{ matrix.repo }}
        run: echo "value=${TARGET_REPO//\//-}" >> "$GITHUB_OUTPUT"

      - name: Scan and sync issues
        env:
          # Needs contents:read on the target repo plus issues:write to file
          # findings there. Add security_events:write only for repos that set
          # uploadSarif.
          GITHUB_TOKEN: ${{ secrets.SCAN_TOKEN }}
          # zizmor's online audits resolve actions through the GitHub API and
          # abort with 401 rather than degrading if no token is present.
          GH_TOKEN: ${{ secrets.SCAN_TOKEN }}
          # Same reasoning as the matrix step: keep expansions out of the script.
          TARGET_REPO: ${{ matrix.repo }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi

          node scanner/security-scanner/src/index.mjs run \
            --config scanner/security-scanner/config/repos.json \
            --repo "$TARGET_REPO" \
            --dir target \
            --out scan-out \
            "${ARGS[@]+"${ARGS[@]}"}"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Named by repo rather than job index: with several targets,
          # "findings-0" tells you nothing about which repo you are opening.
          # Slashes are not allowed in artifact names, so the owner separator
          # becomes a dash.
          name: findings-${{ steps.slug.outputs.value }}
          path: scan-out/
          retention-days: 30
          # The scan is skipped when the access preflight fails, leaving no
          # output. That is an expected outcome, not something to warn about
          # on every run until a token is configured.
          if-no-files-found: ignore
